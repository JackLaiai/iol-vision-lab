<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explore Lenses｜IOL Catalog</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="iol-catalog.css"><script src="evidence-routing.js" defer></script><script src="evidence-utils.js" defer></script><script src="iol-catalog.js" defer></script></head><body class="catalog"><header class="nav-shell"><nav class="nav"><a href="index.html" class="brand">IOL Vision Lab</a><a href="evidence-coverage.html">Evidence Coverage</a><a href="methodology.html">資料怎麼來的？</a></nav></header><main><h1>IOL Catalog / Explore Lenses</h1><p>本頁整理台灣可查得之人工水晶體產品與公開證據，並非產品排名或個別醫療建議。實際適用型號與費用仍依醫療院所及最新核准／給付資訊為準。</p><p>以 catalog 名稱群組；僅當 Toric 名稱去除結尾 Toric 後與既有非 toric 名稱完全一致，才合併展示。不推定鏡片設計相同，各型號證據獨立。</p><p id="selection" role="status">尚未選擇比較產品（最多兩顆）</p><button id="clear-selection" type="button">清除比較選擇</button><div class="catalog-layout"><aside><details id="filters" open><summary>篩選與搜尋</summary><label>搜尋<input id="search" type="search" placeholder="產品、型號、製造商"></label><label>Manufacturer<select id="manufacturer"></select></label><label>Lens category<select id="category"></select></label><label>Toric / non-toric<select id="toric"><option value="">全部</option><option value="true">Toric</option><option value="false">Non-toric</option><option value="unknown">尚無資料</option></select></label><label>Taiwan market status<select id="market"></select></label><label>Structured evidence available<select id="evidence"><option value="">全部</option><option value="yes">已整理</option><option value="no">尚未整理</option><option value="error">暫時無法載入</option></select></label></details></aside><section><p id="catalog-status" role="status">載入中…</p><div id="families"></div></section></div></main></body></html>
